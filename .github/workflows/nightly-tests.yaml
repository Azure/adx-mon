name: Nightly Tests

on:
  schedule:
    - cron:  '0 3 * * *'
  workflow_dispatch:

env:
  GOPROXY: https://proxy.golang.org/

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: '1.27'

    - name: Update apt
      run: sudo apt update

    - name: Install dependencies
      run: sudo apt install -y libsystemd-dev systemd-journal-remote # for collector journal input and test fixtures

    - name: Test
      run: ENABLE_ASSERTIONS=true INTEGRATION=1 ROLLBACK=1 go test -race -mod=vendor -v -timeout=120m ./...
