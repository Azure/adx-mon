# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, review_requested, synchronize, reopened]
  merge_group:

permissions: {}

jobs:

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.26

    - name: Update apt
      run: sudo apt update

    - name: Install dependencies
      run: sudo apt install -y libsystemd-dev systemd-journal-remote # for collector journal input and test fixtures

    - name: Check gofmt
      run: |
        unformatted=$(find . -type d -name vendor -prune -o -type f -name '*.go' -print0 | xargs -0 gofmt -l)
        if [ -n "$unformatted" ]; then
          echo "The following files are not gofmt'd:"
          echo "$unformatted"
          exit 1
        fi

    - name: Build
      run: go build -mod=vendor -v ./...

    - name: Test
      run: ENABLE_ASSERTIONS=true go test -race -mod=vendor -v -timeout=30m ./...

    - name: Ensure docs are updated
      run: |
        make gendocs
        if ! git diff --exit-code -- docs/config.md; then
          echo "docs/config.md is not up to date. Please run 'make gendocs' and commit the changes." >&2
          exit 1
        fi

    - name: Ensure k8s bundle is updated
      run: |
        make k8s-bundle
        if ! git diff --exit-code -- build/k8s/bundle.sh; then
          echo "build/k8s/bundle.sh is not up to date. Please run 'make k8s-bundle' and commit the changes." >&2
          exit 1
        fi

    - name: Ensure CRDs are updated
      run: |
        make generate-crd CMD=update
        generated_paths=(api/v1 kustomize/bases operator/manifests/crds tools/crdgen/PROJECT)
        generated_changes=$(git status --porcelain --untracked-files=all -- "${generated_paths[@]}")
        if [ -n "$generated_changes" ]; then
          git diff -- "${generated_paths[@]}"
          printf '%s\n' "$generated_changes"
          echo "Generated CRDs or deepcopy code are out of date. Please run 'make generate-crd CMD=update' and commit the changes." >&2
          exit 1
        fi
